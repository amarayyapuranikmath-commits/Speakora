# Serves the SPA and proxies API + signalling to the backend so everything is same-origin
# (required for the SameSite=Strict refresh cookie). TLS is terminated in front of this by Caddy (see docs/DEPLOYMENT.md).

# Caddy is the only thing in front of this container: trust its X-Forwarded-For for the real client address.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Signed Android release APK, copied here by scripts/publish-android-apk.ps1 (mounted read-only from ./downloads).
    location /downloads/ {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/downloads/;
        types { application/vnd.android.package-archive apk; text/plain sha256; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        autoindex off;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
