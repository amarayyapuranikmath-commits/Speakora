# Included in EVERY location that sets its own add_header: nginx drops inherited add_header lines as soon as a location
# defines any, so without this the home page would lose its security headers.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
# 'unsafe-inline' for styles only (React and Recharts set inline style attributes). Scripts stay same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Effective once TLS is terminated in front of this container (browsers ignore it over plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
