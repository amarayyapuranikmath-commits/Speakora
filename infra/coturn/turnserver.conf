# Coturn configuration using time-limited REST credentials (matches IceServerService in the backend).
# Replace the placeholders; never commit real values. TURN_SHARED_SECRET in the backend must equal static-auth-secret.

listening-port=3478
tls-listening-port=5349
# The server's public IP (required when behind NAT) and the realm clients authenticate against.
external-ip=YOUR_PUBLIC_IP
realm=turn.example.com
server-name=turn.example.com

use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SHARED_SECRET

# Relay port range: open these UDP ports in the firewall as well as 3478/5349.
min-port=49152
max-port=49252

fingerprint
no-multicast-peers
no-cli
# Block relaying into private networks so TURN cannot be used to reach internal services.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# TLS for turns: (certificate paths on the TURN host)
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Do not log secrets/usernames verbosely in production.
no-stdout-log
log-file=/var/log/turnserver.log
