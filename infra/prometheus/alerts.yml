groups:
  - name: english-speaking
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Backend is not answering metrics scrapes" }
      - alert: HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of requests are failing with 5xx" }
      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "95th percentile response time is above 1 second" }
      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Requests are waiting for a database connection" }
      - alert: JvmMemoryHigh
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "JVM heap above 90%" }
