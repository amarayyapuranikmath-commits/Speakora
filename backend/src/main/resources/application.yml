spring:
  application:
    name: english-speaking-platform
  config:
    # Local development reads ../.env. Production can mount secrets as files (Docker/Kubernetes secrets): a file named
    # JWT_SECRET, DB_PASSWORD, GROQ_API_KEY... in SECRETS_DIR provides that value without it ever being an environment variable.
    import: optional:file:../.env[.properties],optional:configtree:${SECRETS_DIR:/run/secrets}/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/english_speaking}
    username: ${DB_USER:esp_app}
    password: ${DB_PASSWORD}
    hikari:
      # The default of 10 was fully used, with requests waiting, at about 100 Quick Match joins per second, and a burst of sign-ups (each holds a
      # connection while it hashes the password and sends the code e-mail) pushed Quick Match from 0.1 s to 11 s. 20 removed that in the same test
      # (docs/SCALABILITY.md). Keep it below PostgreSQL's max_connections divided by the number of instances.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
      # Fail fast: without this a Redis outage would stall every API call (rate limiter) for the 60 s driver default.
      timeout: 2s
      connect-timeout: 2s
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080
  shutdown: graceful
  # Deliberately NOT "framework": that makes getRemoteAddr(), the scheme and the host follow headers any client can send. The caller's
  # address comes from ClientIpResolver, which believes X-Forwarded-For only from the proxies listed in TRUSTED_PROXIES.
  forward-headers-strategy: none

# API docs are off unless explicitly enabled (SWAGGER_ENABLED=true in development).
springdoc:
  api-docs.enabled: ${SWAGGER_ENABLED:false}
  swagger-ui.enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  # Ready only when the app can actually serve traffic: it needs PostgreSQL and Redis.
  endpoint.health.group.readiness.include: readinessState,db,redis

app:
  mail-from: ${MAIL_FROM:no-reply@example.com}
  # Send mail in the background (never slows a request, never reveals through timing whether an account exists).
  mail-async: ${MAIL_ASYNC:true}
  # Plain text by default (what a new sending account gets delivered reliably); true adds the HTML version as a second part.
  mail-html: ${MAIL_HTML:false}
  # Most sign-up / reset code emails the service will send in a day (the sending account is limited by the mail provider: Gmail, about 500). 0 = no cap.
  mail-daily-limit: ${MAIL_DAILY_LIMIT:400}
  # Keep unverified accounts out of matching, calls, friends and private messages. On in production (application-prod.yml).
  require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}
  name: ${APP_NAME:Speakora}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-ttl-days: ${REFRESH_TTL_DAYS:30}
  cookie-secure: ${COOKIE_SECURE:false}
  # Comma-separated emails promoted to ADMIN once their address is verified (also settable with SQL: update users set role='ADMIN').
  admin-emails: ${ADMIN_EMAILS:}
  # TURN relay credentials come from Turnix (https://turnix.io). The token is read only here, on the server.
  turn:
    api-token: ${TURNIX_API_TOKEN:}
    api-url: ${TURNIX_API_URL:https://turnix.io/api/v1/credentials/ice}
    force-relay: ${TURN_FORCE_RELAY:false}
    # IPs/CIDRs of reverse proxies (Caddy, a load balancer) whose X-Forwarded-For is trusted for the end user's IP. Empty: trust none.
    trusted-proxies: ${TRUSTED_PROXIES:}
  # AI tutor and coach (Groq, OpenAI-compatible API). Disabled (and reported as unavailable) unless GROQ_API_KEY is set.
  coach:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    daily-limit: ${COACH_DAILY_LIMIT:20}
