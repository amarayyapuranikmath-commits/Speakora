# Tests must never use (or depend on) a developer's real mail settings from ../.env: with SMTP_HOST set, a test that reaches the real
# MailService would send real email through the developer's account. Mail is not configured in tests; the SMTP behaviour is tested
# against an in-process server (MailSmtpTest) and the sign-up / reset flows with the mail service mocked or logging.
RESEND_API_KEY=
SMTP_HOST=
SMTP_USER=
SMTP_PASSWORD=
# The daily cap on code emails lives in Redis, which tests share with the running app: tests must neither use it up nor be blocked by it.
app.mail-daily-limit=0

# Each cached Spring test context keeps its own connection pool. At the default size of 20 a full run exhausts PostgreSQL's connections, and the integration
# classes that connect last are then silently skipped by their own "database not reachable" guard. A small pool is plenty for tests.
DB_POOL_SIZE=4
spring.datasource.hikari.minimum-idle=1
